services:
  db:
    image: postgres:17-alpine
    container_name: saas_db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=saas_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_db || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s
      timeout: 5s

  backend:
    build: .
    container_name: saas_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/saas_db
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: saas_frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  postgres_data:
