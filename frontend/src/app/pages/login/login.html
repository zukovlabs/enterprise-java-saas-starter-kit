<div class="login-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Welcome Back</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="email" name="email" placeholder="admin@example.com">
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [(ngModel)]="password" name="password" type="password">
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions class="actions-container">
      <button mat-flat-button color="primary" class="login-button" (click)="onLogin()">Log In</button>
      <a routerLink="/register" class="link-text">Don't have an account? Sign up</a>
    </mat-card-actions>
  </mat-card>
</div>
