spring:
  application:
    name: enterprise-saas

  docker:
    compose:
      enabled: true
      lifecycle-management: start-only

  datasource:
    url: jdbc:postgresql://localhost:5432/saas_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  url: ${APP_URL:http://localhost:8081}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081,http://localhost}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 86400000
    refresh-token-expiration: 604800000
